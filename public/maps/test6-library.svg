<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="600" height="420" fill="#f7f7f2"/>
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold">Hartwell Library — Ground Floor</text>
  <!-- outer walls -->
  <rect x="30" y="40" width="540" height="340" fill="#fff" stroke="#333" stroke-width="3"/>
  <!-- entrance gap on the south wall -->
  <rect x="270" y="374" width="60" height="12" fill="#f7f7f2"/>
  <text x="300" y="413" text-anchor="middle" font-size="12">Main entrance (Station Road)</text>
  <path d="M300,400 L300,388 M294,394 L300,387 L306,394" stroke="#333" stroke-width="2" fill="none"/>
  <!-- rooms: west side -->
  <g fill="none" stroke="#555" stroke-width="2">
    <rect x="30" y="40" width="150" height="110"/>
    <rect x="30" y="150" width="150" height="110"/>
    <rect x="30" y="260" width="150" height="120"/>
    <!-- east side -->
    <rect x="420" y="40" width="150" height="110"/>
    <rect x="420" y="150" width="150" height="110"/>
    <rect x="420" y="260" width="150" height="120"/>
    <!-- north centre -->
    <rect x="180" y="40" width="240" height="90"/>
  </g>
  <!-- given labels -->
  <rect x="245" y="300" width="110" height="34" rx="4" fill="#eef" stroke="#557"/>
  <text x="300" y="321" text-anchor="middle" font-size="12">Information desk</text>
  <rect x="268" y="175" width="64" height="70" fill="#ddd" stroke="#777"/>
  <text x="300" y="205" text-anchor="middle" font-size="12">Lifts &amp;</text>
  <text x="300" y="220" text-anchor="middle" font-size="12">stairs</text>
  <!-- letters -->
  <g font-weight="bold" font-size="14" text-anchor="middle">
    <g><circle cx="105" cy="95" r="14" fill="#fff" stroke="#000"/><text x="105" y="100">A</text></g>
    <g><circle cx="300" cy="85" r="14" fill="#fff" stroke="#000"/><text x="300" y="90">B</text></g>
    <g><circle cx="495" cy="95" r="14" fill="#fff" stroke="#000"/><text x="495" y="100">C</text></g>
    <g><circle cx="105" cy="205" r="14" fill="#fff" stroke="#000"/><text x="105" y="210">D</text></g>
    <g><circle cx="495" cy="205" r="14" fill="#fff" stroke="#000"/><text x="495" y="210">E</text></g>
    <g><circle cx="105" cy="320" r="14" fill="#fff" stroke="#000"/><text x="105" y="325">F</text></g>
    <g><circle cx="495" cy="320" r="14" fill="#fff" stroke="#000"/><text x="495" y="325">G</text></g>
    <g><circle cx="215" cy="345" r="14" fill="#fff" stroke="#000"/><text x="215" y="350">H</text></g>
  </g>
</svg>
